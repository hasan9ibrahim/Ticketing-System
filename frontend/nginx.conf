server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # CRA content-hashes build output filenames (e.g. main.<hash>.js) - any
  # code change produces a new filename, so these are safe to cache
  # indefinitely. Without this, every reload paid a revalidation round trip
  # (a 200 once, then a 304 on every subsequent load) instead of the browser
  # using its cached copy with no network request at all.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html itself must always be revalidated so a new deployment's
  # hashed asset references get picked up promptly instead of a client
  # being stuck on a stale build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # React SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
