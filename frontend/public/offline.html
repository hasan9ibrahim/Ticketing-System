<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline | Wii Telecom</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #09090b; color: #e4e4e7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center; padding: 16px; box-sizing: border-box;
      }
      img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #fff; }
      p { margin: 0 0 20px; color: #a1a1aa; font-size: 14px; }
      button {
        background: #10b981; color: #000; border: 0; border-radius: 6px;
        padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>The ticketing system needs an internet connection.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
